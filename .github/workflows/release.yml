# Build the flashable images on GitHub's machines and publish a release.
#
# Manual only. Four images take a while and nobody wants them on every
# commit; CI (ci.yml) covers each push.
#
# The four builds run as a MATRIX rather than in sequence. Partly for
# wall-clock -- each one decompresses a 2.7GB base image, grows it, runs apt
# inside a chroot under QEMU emulation and then xz-compresses the result --
# and partly for disk: a hosted runner has about 14GB free, and one build
# needs most of it. Four in one job would not fit.
name: Release images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, e.g. v0.4.0'
        required: true
        type: string
      draft:
        description: 'Create the release as a draft'
        required: false
        default: true
        type: boolean
      prerelease:
        description: 'Mark as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    name: Create the draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Create an empty draft for the builds to upload into
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "release ${{ inputs.version }} already exists; reusing it"
          else
            gh release create "${{ inputs.version }}" \
              --title "${{ inputs.version }}" --notes "Build in progress..." --draft
          fi

  build:
    name: ${{ matrix.arch }} / ${{ matrix.variant }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [armhf, arm64]
        variant: [plain, oled]

    steps:
      - uses: actions/checkout@v4

      # A hosted runner ships with Android SDKs, .NET, GHC and a large Docker
      # cache that together occupy tens of gigabytes. The build needs the
      # space far more than this job needs any of them.
      - name: Free up disk
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          sudo apt-get clean
          echo "after:"; df -h / | tail -1

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - name: Build and verify the image
        env:
          P4_VERSION: ${{ inputs.version }}
        run: |
          ./image/build.sh \
            --arch "${{ matrix.arch }}" \
            --variant "${{ matrix.variant }}"

      # Straight to the release, NOT to a workflow artifact.
      #
      # Release assets on a public repo are free and unmetered. Workflow
      # artifacts are not: they come out of the 500MB (2GB on Pro) storage
      # allowance, and four images at ~650MB each would exceed even the Pro
      # quota on a single run. Uploading here also means a failure in one
      # matrix cell does not cost the other three their work.
      - name: Upload this image to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd image/out
          ls -la ./*.img.xz
          gh release upload "${{ inputs.version }}" ./*.img.xz ./*.img.xz.sha256 --clobber

      # The checksum file is a few hundred bytes, so collecting these as
      # artifacts to assemble the notes costs essentially nothing.
      - name: Keep the checksum for the notes
        uses: actions/upload-artifact@v4
        with:
          name: sha-${{ matrix.arch }}-${{ matrix.variant }}
          path: image/out/*.img.xz.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Collect the checksums
        uses: actions/download-artifact@v4
        with:
          pattern: sha-*
          merge-multiple: true
          path: dist-images

      # A release that silently shipped three of four images would be worse
      # than a failed one. Checked against what is ACTUALLY attached to the
      # release, not against what this job happens to have on disk.
      - name: Check the set is complete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          attached=$(gh release view "${{ inputs.version }}" \
            --json assets --jq '.assets[].name')
          echo "attached to the release:"; echo "$attached" | sed 's/^/  /'
          missing=0
          for arch in armhf arm64; do
            for suffix in "" "-oled"; do
              f="P4wnP1-ALOA-${{ inputs.version }}${suffix}-${arch}.img.xz"
              if ! echo "$attached" | grep -qx "$f"; then
                echo "MISSING FROM THE RELEASE: $f"; missing=1
              fi
              if ! echo "$attached" | grep -qx "$f.sha256"; then
                echo "MISSING CHECKSUM: $f.sha256"; missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ] || { echo "the image set is incomplete"; exit 1; }

      - name: Write the release notes
        run: |
          {
            echo "Flashable images for both architectures, in two variants."
            echo
            echo "| Image | Boards | OLED |"
            echo "|---|---|---|"
            echo "| \`P4wnP1-ALOA-${{ inputs.version }}-armhf.img.xz\` | Pi Zero, **Pi Zero W**, Pi 1 | no |"
            echo "| \`P4wnP1-ALOA-${{ inputs.version }}-arm64.img.xz\` | **Pi Zero 2 W**, Pi 3, Pi 4, Pi 5 | no |"
            echo "| \`P4wnP1-ALOA-${{ inputs.version }}-oled-armhf.img.xz\` | Pi Zero, **Pi Zero W**, Pi 1 | yes |"
            echo "| \`P4wnP1-ALOA-${{ inputs.version }}-oled-arm64.img.xz\` | **Pi Zero 2 W**, Pi 3, Pi 4, Pi 5 | yes |"
            echo
            echo "The \`-oled\` images carry the on-device console for the Waveshare 1.3inch"
            echo "OLED HAT and enable SPI. The plain images are verified to contain **no**"
            echo "OLED binary, unit or SPI line, so the difference is a property of the"
            echo "artifact rather than of its filename."
            echo
            echo '```'
            cd dist-images && cat ./*.sha256
            echo '```'
            echo
            echo "Built by GitHub Actions from \`${GITHUB_SHA}\`. Every image was mounted"
            echo "and inspected by image/lib/verify.sh before it was uploaded."
            echo
            echo "**Before you flash**, set a username and password in Raspberry Pi Imager:"
            echo "the image ships no usable account."
          } > NOTES.md
          cat NOTES.md

      - name: Write the notes onto the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ inputs.version }}" \
            --notes-file NOTES.md \
            --draft=${{ inputs.draft }} \
            --prerelease=${{ inputs.prerelease }}
          echo
          gh release view "${{ inputs.version }}" --json isDraft,assets \
            --jq '"draft: \(.isDraft)", (.assets[] | "  \(.name)  \(.size) bytes")'
